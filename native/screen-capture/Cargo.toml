[package]
name = "screen-capture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "2"
ashpd = { version = "0.13", features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mimalloc = "0.1"

[build-dependencies]
napi-build = "2"
